# YuE to Logic on a Docker host (e.g. a Proxmox LXC container with Docker).
#   cp .env.example .env    # adjust if needed
#   docker compose pull && docker compose up -d
name: yue-to-logic

services:
  web:
    image: ghcr.io/marcel-b/yue-to-logic-pro:${IMAGE_TAG:-latest}
    container_name: yue-to-logic
    restart: unless-stopped
    ports:
      # Nginx Proxy Manager forwards music.idsrv.info to this port.
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    environment:
      # Honour X-Forwarded-For/-Proto set by Nginx Proxy Manager (client IP, http/https).
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Host names the app answers to; "*" accepts any (see .env.example).
      AllowedHosts: ${ALLOWED_HOSTS:-*}
      # StemMyWav, which separates a recording into stems. Without both values the app offers no stems.
      Stems__BaseUrl: ${STEMS_BASE_URL:-}
      Stems__ApiKey: ${STEMS_API_KEY:-}
      # The instrument library, a SQLite file in the volume below.
      Data__Path: /data/yue-to-logic.db
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      # A name means a docker volume, a path a host directory (which must be writable by uid 1654, see .env.example).
      - ${DATA_DIR:-data}:/data
    # The root file system stays read-only; the only state, the instrument library, lives in /data.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # To reach the stem gateway by its container name, join the network of its compose project as well:
    # uncomment both blocks below, set STEMS_BASE_URL=http://stemmywav:8080 and make sure that network exists.
    # A gateway published under a name of its own (https://stem.example) needs neither block.
    # networks:
    #   - default
    #   - stemmywav

volumes:
  data:

