name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration "$CONFIGURATION" --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test --configuration "$CONFIGURATION" --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      # End-to-end check of the command-line tool on the official YuE2 example.
      - name: Convert sample score with the CLI
        run: |
          mkdir -p out
          dotnet "src/YueToLogic.Cli/bin/$CONFIGURATION/net10.0/yue2logic.dll" \
            samples/score.abc --output out/sample --bass --drums --dump-json out/sample
          test -s out/sample.mid
          jq -e '.success and ([.score.voices[].id] == ["Vocal", "Ins", "Bass", "Drums"])' out/sample.json

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
