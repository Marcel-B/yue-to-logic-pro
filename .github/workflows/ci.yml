name: CI

on:
  push:
    branches: [main]
    # Version tags (v1.2.0) publish a matching image tag (1.2.0, 1.2).
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Backend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration "$CONFIGURATION" --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test --configuration "$CONFIGURATION" --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      # End-to-end check of the command-line tool on the official YuE2 example.
      - name: Convert sample score with the CLI
        run: |
          mkdir -p out
          dotnet "src/YueToLogic.Cli/bin/$CONFIGURATION/net10.0/yue2logic.dll" \
            samples/score.abc --output out/sample --bass --drums --dump-json out/sample
          test -s out/sample.mid
          jq -e '.success and ([.score.voices[].id] == ["Vocal", "Ins", "Bass", "Drums"])' out/sample.json

      # And the way back: the MIDI file, bass and drums included, becomes the example again.
      - name: Turn the sample's MIDI file back into a score with the CLI
        run: |
          dotnet "src/YueToLogic.Cli/bin/$CONFIGURATION/net10.0/yue2logic.dll" out/sample.mid --output out/sample-back
          diff <(tr -d '\r' < samples/score.abc) out/sample-back.abc

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  publish:
    name: Web frontend and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/YueToLogic.Api/ClientApp/package-lock.json

      # The publish target runs npm ci and npm run build (vue-tsc type check + Vite bundle)
      # and ships the frontend as wwwroot/ui, exactly as for a real deployment.
      - name: Publish API with web frontend
        run: dotnet publish src/YueToLogic.Api --configuration "$CONFIGURATION" --output out/publish

      - name: Check published web frontend
        run: |
          test -f out/publish/wwwroot/ui/index.html
          ls out/publish/wwwroot/ui/assets/*.js

  image:
    name: Container image
    # Only images whose code passed the tests and the publish check are pushed.
    needs: [build-and-test, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # Pull requests only prove that the image builds; main and version tags push it to ghcr.io.
      PUSH: ${{ github.event_name == 'push' }}

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest = newest main; sha-<commit> for every build; 1.2.0 and 1.2 for a v1.2.0 tag.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
